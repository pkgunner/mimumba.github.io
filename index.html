<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little request 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --lav:#efe6ff; --lav2:#e0d0fb; --violet:#8b5cf6; --deep:#5a2fb8;
  --ink:#2a1650; --mute:#7d6aa3; --pink:#ff7eb6; --card:#ffffff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  min-height:100svh; display:grid; place-items:center; padding:20px;
  font-family:"Mali","Sarabun",system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 15% 12%,#fff 0 2px,transparent 3px) 0 0/90px 90px,
    radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 2.5px) 0 0/130px 130px,
    linear-gradient(160deg,#f7f1ff 0%,var(--lav) 55%,var(--lav2) 100%);
}
.card{
  width:min(390px,100%); background:var(--card); border:1.5px solid var(--lav2);
  border-radius:30px; padding:20px 22px 26px; text-align:center;
  box-shadow:0 26px 60px -22px rgba(90,47,184,.45);
}
.badge{
  display:inline-block; font-size:.62rem; letter-spacing:.14em; color:var(--deep);
  background:var(--lav); padding:5px 14px; border-radius:99px; margin-bottom:14px;
}
.pic{
  position:relative; height:184px; border-radius:22px; margin:0 auto 18px;
  overflow:hidden;
  background:var(--lav);
}
.say{
  position:absolute; top:10px; left:12px; background:#fff; color:var(--deep);
  border:2px solid var(--violet); border-radius:14px; padding:3px 12px;
  font-size:.85rem; display:none;
}
.say.on{display:block}
h1{
  font-family:"Mitr",sans-serif; font-weight:500; font-size:clamp(1.3rem,5.4vw,1.6rem);
  line-height:1.45; min-height:3.9em; display:grid; place-items:center; text-wrap:balance;
}
.sub{font-size:.88rem;color:var(--mute);margin:8px 0 20px;min-height:1.4em}
.note{font-size:.85rem;color:var(--deep);margin:-6px 0 14px;display:none}
.btns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.btns.stack{flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;transition:transform .15s,box-shadow .15s}
button:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.yes{
  color:#fff; font-weight:600; padding:13px 24px;
  background:linear-gradient(135deg,var(--violet),var(--deep));
  box-shadow:0 10px 22px -8px rgba(90,47,184,.7);
}
.yes:hover{transform:translateY(-2px)}
.no{background:transparent;color:#9a88bd;font-size:.8rem;padding:10px 14px}
.no:hover{color:var(--deep)}
.stack .yes,.stack .no{width:100%}
.stack .no{background:var(--lav);color:var(--deep);font-size:.85rem;padding:12px}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.heart{
  position:fixed; bottom:-30px; font-size:22px; pointer-events:none; z-index:9;
  animation:rise var(--d) ease-out forwards;
}
@keyframes rise{to{transform:translateY(-105vh) rotate(var(--r));opacity:0}}

#k{width:100%;height:100%;object-fit:cover;border-radius:22px}
#k[data-mood=love]{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="card" id="card">
  <span class="badge" id="badge">A LITTLE REQUEST</span>

  <div class="pic">
    <span class="say" id="say"></span>
    <img id="k" src="https://i.pinimg.com/originals/0d/fb/3a/0dfb3a09665a1816df83090fa58c0e4d.gif" alt="คุโรมิ" data-mood="shy">
  </div>

  <h1 id="title" aria-live="polite"></h1>
  <p class="sub" id="sub"></p>
  <p class="note" id="note">แคปหน้าจอคำตอบนี้ แล้วส่งให้เราทางแชตด้วยนะ 📸💬</p>

  <div class="btns" id="btns">
    <button class="yes" id="yes"></button>
    <button class="no" id="no"></button>
  </div>
</main>


<script>
/* ===== แก้ข้อความตรงนี้ ===== */
const SUB     = "เราอยากค่อย ๆ ทำให้ทุกอย่างดีขึ้นด้วยกันนะ";

const STEPS = [
  {t:"เรากลับมาเริ่มต้นกันใหม่ได้ไหม? 🥺", y:"💜 ได้สิ", n:"🥺 ไม่กลับไปหรอกนะ", m:"shy"},
  {t:"นะ... ขออีกครั้งได้ไหม 🥺", y:"💜 กลับมาเป็นเหมือนเดิม", n:"ยังไม่กลับหรอก", m:"plead"},
  {t:"เราสัญญาว่าจะทำให้ดีกว่าเดิมนะ", y:"💜 ให้โอกาสเราอีกครั้งนะ", n:"ยังไม่กลับ 😒", m:"sweat", s:"Sorry"},
  {t:"เรายังคิดถึงเธออยู่นะ...", y:"💜 กลับมาเถอะนะ", n:"ไม่กลับหรอก 😒", m:"plead"},
  {t:"ครั้งนี้เราจะไม่ทำให้เธอต้องเสียใจอีก", y:"💜 ขอเริ่มใหม่กับเธอได้ไหมนะ", n:"ยังไม่ใจอ่อนหรอก!", m:"sweat"},
  {t:"ถ้าให้เราง้อจนกว่าจะใจอ่อน เราก็ยอมนะ 🥺", y:"💜 ใจอ่อนให้เราเถอะนะ", n:"ยังไม่กลับ!", m:"cry"},
  {t:"เราไม่อยากเป็นแค่คนในอดีตของเธอเลย...", y:"💜 กลับมาเป็นคนของเรานะ", n:"ไม่ง่ายขนาดนั้นหรอก", m:"cry"},
  {t:"เรารู้ว่าคำขอโทษอาจแก้ไขทุกอย่างไม่ได้... แต่เรายังอยากแก้ไขมันด้วยตัวเอง", y:"💜 ขอแก้ตัวอีกครั้งได้ไหม", n:"ยังไม่ให้อภัยหรอก 😢", m:"plead"}
];
const FINAL = {t:"โอเค... เราจะไม่บังคับเธอแล้ว แต่อยากให้รู้ว่า... ความรู้สึกของเธอสำคัญกับเราเสมอ 🥺",
  y:"💜 ถ้าเธอพร้อม กลับมาเริ่มใหม่กันนะ", n:"รับรู้ความรู้สึกแล้วนะ ขอบคุณที่บอกกัน"};
const WIN = {t:"ขอบคุณที่ให้โอกาสเรานะ 💜", sub:"เราจะตั้งใจทำให้ดีกว่าเดิมนะ"};
/* รูป/GIF ของคุโรมิ แยกตามอารมณ์ — ใส่ไฟล์ .gif ของตัวเองแทนได้ เช่น "gifs/cry.gif" */
const GIF1 = "https://i.pinimg.com/originals/0d/fb/3a/0dfb3a09665a1816df83090fa58c0e4d.gif";
const GIF2 = "https://i.pinimg.com/originals/cd/8a/35/cd8a35cc7c1bb5e7d88c7374c2215067.gif";
const GIF3 = "https://media.tenor.com/lFcsl1UBhm0AAAAj/kuromi-crying.gif";
const GIF4 = "https://media.tenor.com/e_yDx2QYYwYAAAAj/kuromi-sad.gif";
const GIF5 = "https://i.pinimg.com/originals/17/e1/39/17e13977ee118b9e920b24326a49f1d6.gif";
const IMG = {shy:GIF1, plead:GIF4, sweat:GIF5, cry:GIF3, wait:GIF2, love:GIF2};
/* ========================== */

const $ = id => document.getElementById(id);
let i = 0, mode = "ask";

function show(o){
  $("title").textContent = o.t;
  if (o.y) $("yes").textContent = o.y;
  if (o.n) $("no").textContent = o.n;
  $("k").dataset.mood = o.m || "wait";
  $("k").src = IMG[o.m || "wait"];
  $("say").textContent = o.s || "";
  $("say").classList.toggle("on", !!o.s);
  ["title","k"].forEach(id => { const e=$(id); e.classList.remove("swap"); void e.offsetWidth; e.classList.add("swap"); });
}

function hearts(n){
  const set = ["💜","🤍","💖","✨","🦇"];
  for (let c=0;c<n;c++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = set[Math.floor(Math.random()*set.length)];
    h.style.left = Math.random()*100 + "vw";
    h.style.setProperty("--d", (2.4+Math.random()*2.2)+"s");
    h.style.setProperty("--r", (Math.random()*80-40)+"deg");
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 5000);
  }
}

function toFinal(){
  mode = "final";
  $("badge").textContent = "I’LL WAIT";
  $("sub").textContent = "เราจะรอเธอนะ 💜";
  $("note").style.display = "block";
  $("btns").classList.add("stack");
  show({...FINAL, m:"wait"});
  hearts(8);
}

function win(){
  mode = "win";
  $("badge").textContent = "THANK YOU";
  $("sub").textContent = WIN.sub;
  $("note").style.display = "block";
  $("btns").style.display = "none";
  show({t:WIN.t, m:"love"});
  hearts(40);
}

$("yes").onclick = () => (mode === "win" ? null : win());

$("no").onclick = () => {
  if (mode === "ask"){
    $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake");
    i++;
    i < STEPS.length ? show(STEPS[i]) : toFinal();
  } else if (mode === "final"){
    mode = "ack";
    $("btns").style.display = "none";
    $("sub").textContent = "เราตั้งใจรอเธออยู่เสมอ";
    $("k").dataset.mood = "shy"; $("k").src = IMG.shy;
    $("say").textContent = "Pretty please!"; $("say").classList.add("on");
    hearts(10);
  }
};

$("sub").textContent = SUB;
show(STEPS[0]);
</script>
</body>
</html>
